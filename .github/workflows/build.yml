name: Build Android TV

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（留空则仅上传构建产物）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  android-tv:
    name: Android TV APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 应用框架补丁并安装依赖
        shell: pwsh
        run: lib/scripts/patch.ps1

      - name: 写入签名配置
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$SIGN_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
            printf 'storeFile=key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          fi

      - name: 生成版本信息
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: 静态分析
        run: flutter analyze --no-pub --no-fatal-infos

      - name: 运行测试
        run: flutter test --no-pub

      - name: 构建 arm64 APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define-from-file=pili_release.json --no-pub --obfuscate --split-debug-info=build/symbols

      - name: 构建 armeabi-v7a APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm --dart-define-from-file=pili_release.json --no-pub --obfuscate --split-debug-info=build/symbols

      - name: 构建 universal APK
        run: flutter build apk --release --dart-define-from-file=pili_release.json --no-pub --obfuscate --split-debug-info=build/symbols

      - name: 命名安装包
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "BPlus_TV_${version}_arm64-v8a.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "BPlus_TV_${version}_armeabi-v7a.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "BPlus_TV_${version}_universal.apk"

      - name: 解析发行标签并清理旧发行
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # 同 tag 重发时先删除旧 Release（含游离的旧 Release），保证产物干净。
          gh release delete "$TAG" --yes --cleanup-tag || true
          echo "release_tag=$TAG" >> "$GITHUB_ENV"

      - name: 发布
        if: env.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.release_tag }}
          name: BplusTV ${{ env.release_tag }}（${{ env.build_date }}）
          body: |
            构建时间：${{ env.build_date }}（北京时间）
            版本：${{ env.release_tag }}

            ## 本次变更

            https://github.com/${{ github.repository }}/commits/${{ env.release_tag }}
          files: BPlus_TV_*.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          # 多文件上传必须走默认打包（archive:false 仅支持单文件）。
          name: Android-TV-APK
          path: BPlus_TV_*.apk

      - name: 上传调试符号
        uses: actions/upload-artifact@v7
        with:
          name: Android-TV-symbols
          path: build/symbols/
