name: Build Android TV

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（留空则仅上传构建产物）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  android-tv:
    name: Android TV APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUB_HOSTED_URL: https://pub.dev
    # 项目源码位于仓库的 BplusTV/ 子目录。
    defaults:
      run:
        working-directory: BplusTV

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            BplusTV/android/*.gradle*
            BplusTV/android/**/gradle-wrapper.properties

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: BplusTV/pubspec.yaml
          cache: true

      - name: 应用框架补丁并安装依赖
        shell: pwsh
        run: lib/scripts/patch.ps1

      - name: 写入签名配置
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$SIGN_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
            printf 'storeFile=key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          fi

      - name: 生成版本信息
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: 静态分析
        run: flutter analyze --no-pub --no-fatal-infos

      - name: 运行测试
        run: flutter test --no-pub

      - name: 构建 TV APK
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub --obfuscate --split-debug-info=build/symbols

      - name: 命名安装包
        shell: bash
        run: |
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="${file##*/app-}"
            abi="${abi%-release.apk}"
            mv "$file" "BPlus_TV_${version}_${abi}.apk"
          done

      - name: 发布
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: BplusTV/BPlus_TV_*.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android-TV-APK
          path: BplusTV/BPlus_TV_*.apk

      - name: 上传调试符号
        uses: actions/upload-artifact@v7
        with:
          name: Android-TV-symbols
          path: BplusTV/build/symbols/
